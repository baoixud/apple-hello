<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apple Hello</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    color: #f5f5f7;
    font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
    font-feature-settings: "kern" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    background: #000;
    -webkit-tap-highlight-color: transparent;
  }

  header, main, .typebar { position: relative; z-index: 1; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 52px;
    padding: 0 24px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(29,29,31,.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .brand {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.022em;
    color: #f5f5f7;
    white-space: nowrap;
  }

  .controls { display: flex; align-items: center; gap: 20px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 8px;
    background: none;
    color: rgba(255,255,255,.8);
    border: 0;
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: -.01em;
    line-height: 1;
    cursor: pointer;
    transition: color .18s, background .18s;
  }
  .btn:hover { color: #fff; background: rgba(255,255,255,.06); }
  .btn:focus-visible { outline: 2px solid #8b8cf8; outline-offset: 2px; }
  .btn svg { width: 14px; height: 14px; }

  .dd { position: relative; }

  .dd-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    background: none;
    color: rgba(255,255,255,.8);
    border: 0;
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: -.01em;
    line-height: 1;
    cursor: pointer;
    transition: color .18s, background .18s;
  }
  .dd-btn:hover { color: #fff; background: rgba(255,255,255,.06); }
  .dd-btn:focus-visible { outline: 2px solid #8b8cf8; outline-offset: 2px; }
  .dd-btn .globe { width: 15px; height: 15px; color: rgba(255,255,255,.55); }
  #ddLabel { min-width: 0; text-align: left; white-space: nowrap; }
  .dd-chev {
    width: 10px;
    height: 6px;
    margin-left: 4px;
    color: rgba(255,255,255,.5);
    transition: transform .2s;
  }
  .dd.open .dd-chev { transform: rotate(180deg); }

  .dd-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 300px;
    display: flex;
    flex-direction: column;
    background: rgba(28,28,31,.94);
    backdrop-filter: blur(30px) saturate(140%);
    -webkit-backdrop-filter: blur(30px) saturate(140%);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    overflow: hidden;
    opacity: 0;
    transform: translateY(-6px) scale(.98);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
  }
  .dd.open .dd-panel {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .dd-search {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 46px;
    padding: 0 14px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.45);
  }
  .dd-search input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: #fff;
    font: inherit;
    font-size: 14px;
    letter-spacing: -.01em;
  }
  .dd-search input::placeholder { color: rgba(255,255,255,.35); }

  .dd-list {
    list-style: none;
    margin: 0;
    padding: 6px;
    max-height: 340px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.2) transparent;
  }
  .dd-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 9px;
    font-size: 13px;
    letter-spacing: -.01em;
    color: #d4d4da;
    cursor: pointer;
  }
  .dd-item.active { background: rgba(255,255,255,.08); color: #fff; }
  .dd-item .tick {
    color: #a5b4fc;
    font-size: 13px;
    visibility: hidden;
  }
  .dd-item[aria-selected="true"] .tick { visibility: visible; }
  .dd-empty {
    padding: 16px 10px;
    font-size: 12px;
    color: rgba(255,255,255,.4);
  }

  .dd-foot {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 12px;
    letter-spacing: -.005em;
    color: rgba(255,255,255,.4);
  }
  .kbd {
    display: inline-grid;
    place-items: center;
    min-width: 20px;
    height: 18px;
    padding: 0 5px;
    border-radius: 5px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    font-size: 11px;
    color: rgba(255,255,255,.6);
  }

  main {
    display: grid;
    place-items: center;
    padding: 24px;
    min-height: 0;
  }

  .stage {
    width: min(92vw, 960px);
    aspect-ratio: 2.8 / 1;
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .stage .msg {
    font-size: 13px;
    color: rgba(255,255,255,.4);
  }

  svg.hello-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    fill: none;
  }

  svg.hello-svg path {
    fill: none;
    stroke: #fff;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    opacity: 0;
  }
  svg.hello-svg path.draw {
    animation: draw 1s cubic-bezier(.45,.05,.55,.95) forwards;
    opacity: 1;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .typebar {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 4px 24px 8px;
  }
  .typebar input {
    width: min(92vw, 520px);
    padding: 12px 18px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    color: #fff;
    font: inherit;
    font-size: 15px;
    letter-spacing: -.01em;
    outline: none;
    transition: border-color .18s, background .18s;
  }
  .typebar input::placeholder { color: rgba(255,255,255,.35); }
  .typebar input:focus {
    border-color: rgba(139,140,248,.8);
    background: rgba(255,255,255,.09);
  }

  .dd-grab, .dd-sheet-head, .dd-backdrop { display: none; }

  @media (max-width: 560px) {
    .dd-btn { min-width: 0; }
  }

  @media (max-width: 700px) {
    header {
      height: auto;
      z-index: auto;
      min-height: calc(52px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      background: rgba(29,29,31,.92);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .brand { font-size: 17px; }
    .controls { gap: 8px; }

    .btn, .dd-btn {
      height: 44px;
      min-height: 44px;
      font-size: 17px;
      padding: 0 12px;
    }
    .dd-btn { min-width: 0; }
    .dd-btn .globe { width: 18px; height: 18px; }
    .dd-chev { width: 12px; height: 7px; }

    main { padding: 16px; }
    .typebar { padding: 4px 16px calc(12px + env(safe-area-inset-bottom)); }
    .typebar input { width: 100%; font-size: 16px; }

    .dd-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      z-index: 40;
    }
    .dd-backdrop.show { opacity: 1; pointer-events: auto; }
    body.sheet-open { overflow: hidden; }

    .dd-panel {
      position: fixed;
      top: auto;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 80vh;
      max-height: 80svh;
      border-radius: 14px 14px 0 0;
      border: 0;
      background: #1c1c1e;
      box-shadow: 0 -12px 40px rgba(0,0,0,.5);
      padding-bottom: env(safe-area-inset-bottom);
      opacity: 1;
      transform: translateY(102%);
      transition: transform .34s cubic-bezier(.32,.72,0,1);
      z-index: 50;
    }
    .dd.open .dd-panel { transform: none; }

    .dd-grab {
      display: block;
      width: 36px;
      height: 5px;
      margin: 8px auto 0;
      border-radius: 3px;
      background: rgba(255,255,255,.28);
    }
    .dd-sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.022em;
    }
    .dd-done {
      min-height: 44px;
      padding: 0 2px;
      background: none;
      border: 0;
      color: #0a84ff;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .dd-search {
      height: 40px;
      margin: 10px 16px 6px;
      padding: 0 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(118,118,128,.24);
      color: rgba(255,255,255,.55);
    }
    .dd-search input { font-size: 17px; }

    .dd-list {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      padding: 0 16px 16px;
    }
    .dd-item {
      min-height: 48px;
      padding: 12px 4px;
      font-size: 17px;
      border-radius: 0;
      border-bottom: .5px solid rgba(255,255,255,.1);
    }
    .dd-item:last-child { border-bottom: 0; }
    .dd-item.active { background: none; color: #fff; }
    .dd-item .tick { color: #0a84ff; font-size: 16px; }
    .dd-foot { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Apple Hello</div>
  <div class="controls">
    <div class="dd" id="dd">
      <button class="dd-btn" id="ddBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddList">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/></svg>
        <span id="ddLabel">English</span>
        <svg class="dd-chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      </button>

      <div class="dd-panel" id="ddPanel">
        <div class="dd-grab" aria-hidden="true"></div>
        <div class="dd-sheet-head"><span>Language</span><button type="button" class="dd-done" id="ddDone">Done</button></div>
        <label class="dd-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="sr-only" style="position:absolute;left:-9999px">Search languages</span>
          <input id="ddSearch" type="text" placeholder="Search languages" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="ddList" aria-autocomplete="list" />
        </label>
        <ul class="dd-list" id="ddList" role="listbox" aria-labelledby="ddBtn"></ul>
        <div class="dd-foot">
          <span><span class="kbd">↑</span> <span class="kbd">↓</span> to move</span>
          <span><span class="kbd">↵</span> to select</span>
          <span style="margin-left:auto"><span class="kbd">Esc</span> to close</span>
        </div>
      </div>
    </div>
    <button class="btn" id="replay" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Replay</button>
  </div>
</header>

<main>
  <div class="stage" id="stage"></div>
</main>

<form class="typebar" id="typeForm" autocomplete="off">
  <input id="word" type="text" placeholder="Type a word (a–z, 1–9) and press Enter…" maxlength="40" />
</form>

<div class="dd-backdrop" id="ddBackdrop"></div>

<script>
const LANGS = {
  en: "English", ar: "Arabic", bg: "Bulgarian", ca: "Catalan", cs: "Czech",
  da: "Danish", de: "German", el: "Greek", es: "Spanish", fi: "Finnish",
  fr: "French", he: "Hebrew", hi: "Hindi", hr: "Croatian", hu: "Hungarian",
  id: "Indonesian", it: "Italian", ja: "Japanese", kk: "Kazakh", ko: "Korean",
  ms: "Malay", nb: "Norwegian Bokmål", nl: "Dutch", pl: "Polish", pt: "Portuguese",
  pt_BR: "Portuguese (Brazil)", ro: "Romanian", ru: "Russian", sk: "Slovak",
  sv: "Swedish", th: "Thai", tr: "Turkish", uk: "Ukrainian", vi: "Vietnamese",
  "zh-Hans": "Chinese (Simplified)", "zh-Hant": "Chinese (Traditional)",
  zh_HK: "Chinese (Hong Kong)"
};

const GLYPHS = {
  a: { w: 340, s: [[[300,240],[240,190],[160,190],[110,240],[120,330],[200,370],[270,340],[300,280],[300,0]]] },
  b: { w: 340, s: [[[80,700],[80,0]], [[80,250],[150,200],[230,195],[290,250],[300,320],[250,400],[170,410],[110,360],[80,300]]] },
  c: { w: 300, s: [[[290,330],[240,400],[160,410],[100,360],[90,230],[120,160],[200,150],[270,190]]] },
  d: { w: 340, s: [[[280,700],[280,0]], [[280,250],[220,195],[140,195],[80,250],[70,320],[120,400],[200,410],[250,360],[280,300]]] },
  e: { w: 320, s: [[[60,230],[280,230],[280,300],[240,380],[160,410],[90,370],[60,280],[70,200],[130,160],[220,150],[280,180]]] },
  f: { w: 260, s: [[[240,690],[190,700],[140,670],[120,600],[120,0]], [[60,410],[220,410]]] },
  g: { w: 340, s: [[[290,250],[250,200],[170,190],[110,240],[110,330],[190,370],[270,340],[300,280]], [[300,420],[300,-60],[260,-150],[180,-180],[110,-150]]] },
  h: { w: 330, s: [[[80,700],[80,0]], [[80,260],[140,200],[230,200],[280,250],[290,0]]] },
  i: { w: 120, s: [[[60,420],[60,0]], [[60,560],[62,566]]] },
  j: { w: 150, s: [[[110,420],[110,-60],[70,-150],[20,-170]], [[110,560],[112,566]]] },
  k: { w: 300, s: [[[80,700],[80,0]], [[260,420],[100,200]], [[140,260],[270,0]]] },
  l: { w: 120, s: [[[60,700],[60,0]]] },
  m: { w: 440, s: [[[60,420],[60,0]], [[60,320],[110,390],[180,400],[220,340],[225,0]], [[225,320],[280,390],[350,400],[385,340],[390,0]]] },
  n: { w: 330, s: [[[80,420],[80,0]], [[80,260],[140,200],[230,200],[280,250],[290,0]]] },
  o: { w: 340, s: [[[170,410],[100,380],[70,310],[80,230],[140,190],[220,200],[270,250],[280,320],[240,390],[170,410]]] },
  p: { w: 340, s: [[[80,420],[80,-200]], [[80,250],[150,200],[230,195],[290,250],[300,320],[250,400],[170,410],[110,360],[80,300]]] },
  q: { w: 340, s: [[[290,420],[290,-200]], [[290,250],[220,195],[140,195],[80,250],[70,320],[120,400],[200,410],[250,360],[290,300]]] },
  r: { w: 240, s: [[[80,420],[80,0]], [[80,300],[120,240],[180,210],[230,210]]] },
  s: { w: 280, s: [[[240,360],[200,400],[130,410],[80,370],[90,310],[160,265],[230,230],[260,170],[220,120],[140,120],[80,160]]] },
  t: { w: 240, s: [[[120,640],[120,80],[160,20],[220,20]], [[60,420],[220,420]]] },
  u: { w: 330, s: [[[80,420],[80,170],[130,120],[210,120],[270,170]], [[280,420],[280,0]]] },
  v: { w: 320, s: [[[60,420],[160,0],[260,420]]] },
  w: { w: 460, s: [[[40,420],[120,0],[220,320],[320,0],[400,420]]] },
  x: { w: 320, s: [[[60,420],[260,0]], [[260,420],[60,0]]] },
  y: { w: 320, s: [[[60,420],[160,0]], [[260,420],[160,20],[90,-80],[60,-160]]] },
  z: { w: 310, s: [[[60,410],[250,410],[60,0],[260,0]]] },

  1: { w: 200, s: [[[60,560],[130,700],[130,0]]] },
  2: { w: 300, s: [[[70,560],[130,680],[210,700],[270,650],[265,560],[200,460],[70,0],[290,0]]] },
  3: { w: 300, s: [[[60,650],[130,700],[220,690],[270,620],[230,540],[140,510],[240,470],[285,380],[240,280],[150,250],[70,290]]] },
  4: { w: 330, s: [[[230,700],[50,220],[300,220]], [[230,220],[230,0]]] },
  5: { w: 300, s: [[[260,700],[90,700],[80,400]], [[80,400],[170,430],[250,400],[275,300],[260,150],[180,110],[90,140],[60,190]]] },
  6: { w: 300, s: [[[250,640],[190,700],[120,650],[70,450],[70,200],[110,120],[190,110],[250,170],[250,250],[190,330],[110,320],[70,270]]] },
  7: { w: 300, s: [[[60,700],[280,700],[140,0]]] },
  8: { w: 300, s: [[[150,400],[90,440],[80,560],[150,700],[220,560],[210,440],[150,400],[70,350],[60,200],[150,0],[240,200],[230,350],[150,400]]] },
  9: { w: 300, s: [[[240,450],[220,330],[170,290],[100,320],[80,420],[110,490],[180,520],[240,470],[250,380],[230,240],[170,100],[100,40],[60,70]]] }
};

const SVG_NS = "http://www.w3.org/2000/svg";
const STAGGER_MS = 300;

const stage     = document.getElementById("stage");
const dd        = document.getElementById("dd");
const ddBtn     = document.getElementById("ddBtn");
const ddLabel   = document.getElementById("ddLabel");
const ddSearch  = document.getElementById("ddSearch");
const ddList    = document.getElementById("ddList");
const ddBackdrop = document.getElementById("ddBackdrop");
const mobileMQ  = window.matchMedia("(max-width: 700px)");
const replayBtn = document.getElementById("replay");
const typeForm  = document.getElementById("typeForm");
const wordInput = document.getElementById("word");

const cache = {};
let currentCode = "en";
let visible = [];
let activeIndex = 0;

function renderList(query = "") {
  const q = query.trim().toLowerCase();
  visible = Object.entries(LANGS).filter(([code, label]) =>
    !q || label.toLowerCase().includes(q) || code.toLowerCase().includes(q));

  ddList.innerHTML = "";

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "dd-empty";
    empty.textContent = `No languages match “${query.trim()}”`;
    ddList.appendChild(empty);
    ddSearch.removeAttribute("aria-activedescendant");
    return;
  }

  activeIndex = Math.min(activeIndex, visible.length - 1);

  visible.forEach(([code, label], i) => {
    const li = document.createElement("li");
    li.className = "dd-item" + (i === activeIndex ? " active" : "");
    li.id = `opt-${code}`;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", code === currentCode ? "true" : "false");
    li.dataset.index = i;

    const name = document.createElement("span");
    name.textContent = label;
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = "✓";

    li.append(name, tick);
    li.addEventListener("mousemove", () => setActive(i));
    li.addEventListener("click", e => {
      e.stopPropagation();
      chooseLanguage(code);
    });
    ddList.appendChild(li);
  });

  ddSearch.setAttribute("aria-activedescendant", `opt-${visible[activeIndex][0]}`);
}

function setActive(i) {
  if (visible.length === 0) return;
  activeIndex = (i + visible.length) % visible.length;
  ddList.querySelectorAll(".dd-item").forEach((li, idx) =>
    li.classList.toggle("active", idx === activeIndex));
  const el = ddList.querySelector(`.dd-item[data-index="${activeIndex}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
  ddSearch.setAttribute("aria-activedescendant", `opt-${visible[activeIndex][0]}`);
}

function openMenu() {
  dd.classList.add("open");
  ddBtn.setAttribute("aria-expanded", "true");
  ddSearch.value = "";
  activeIndex = Math.max(0, Object.keys(LANGS).indexOf(currentCode));
  renderList("");
  const current = ddList.querySelector('[aria-selected="true"]');
  if (current) current.scrollIntoView({ block: "nearest" });
  if (mobileMQ.matches) {
    document.body.classList.add("sheet-open");
    ddBackdrop.classList.add("show");
  } else {
    setTimeout(() => ddSearch.focus(), 0);
  }
}

function closeMenu(returnFocus = false) {
  dd.classList.remove("open");
  document.body.classList.remove("sheet-open");
  ddBackdrop.classList.remove("show");
  ddBtn.setAttribute("aria-expanded", "false");
  if (returnFocus && !mobileMQ.matches) ddBtn.focus();
}

ddBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (dd.classList.contains("open")) closeMenu();
  else openMenu();
});

document.getElementById("ddDone").addEventListener("click", e => {
  e.stopPropagation();
  closeMenu();
});
mobileMQ.addEventListener("change", () => closeMenu());

ddSearch.addEventListener("input", () => {
  activeIndex = 0;
  renderList(ddSearch.value);
});

ddSearch.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(activeIndex + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(activeIndex - 1); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (visible[activeIndex]) chooseLanguage(visible[activeIndex][0]);
  }
  else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
});

document.addEventListener("click", e => {
  if (!dd.contains(e.target)) closeMenu();
});

function chooseLanguage(code) {
  currentCode = code;
  ddLabel.textContent = LANGS[code];
  closeMenu(true);
  wordInput.value = "";
  showGreeting(code);
}

async function loadSvg(code) {
  if (cache[code]) return cache[code];
  const res = await fetch(`svg/hello-${code}.svg`);
  if (!res.ok) throw new Error(`Could not load svg/hello-${code}.svg (${res.status})`);
  const doc = new DOMParser().parseFromString(await res.text(), "image/svg+xml");
  cache[code] = doc.documentElement;
  return cache[code];
}

function buildGreetingSvg(src) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "hello-svg");
  svg.setAttribute("viewBox", src.getAttribute("viewBox"));
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.appendChild(document.importNode(src.querySelector("g"), true));
  svg.querySelectorAll("path").forEach(p => p.setAttribute("pathLength", "1"));
  return svg;
}

async function showGreeting(code) {
  stage.innerHTML = '<div class="msg">Loading…</div>';
  try {
    const src = await loadSvg(code);
    stage.replaceChildren(buildGreetingSvg(src));
    playGreeting();
  } catch (err) {
    stage.innerHTML = "";
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.textContent = err.message;
    stage.appendChild(msg);
    console.error(err);
  }
}

function playGreeting() {
  const paths = stage.querySelectorAll("path");
  if (!paths.length) return;
  const step = Math.min(STAGGER_MS, 6000 / paths.length);
  paths.forEach(p => p.classList.remove("draw"));
  void stage.getBoundingClientRect();
  paths.forEach((p, i) => {
    p.style.animationDelay = `${i * step}ms`;
    p.classList.add("draw");
  });
}

function smoothPath(pts) {
  if (pts.length === 1) {
    const [x, y] = pts[0];
    return `M${x} ${y} L${x + 0.01} ${y + 0.01}`;
  }
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`;
  }
  return d;
}

function buildWord(text) {
  const GAP = 70;
  const SPACE = 200;
  let x = 0;
  const placed = [];

  for (const ch of text) {
    if (ch === " ") { x += SPACE; continue; }
    const glyph = GLYPHS[ch.toLowerCase()];
    if (!glyph) continue;
    placed.push({ glyph, x });
    x += glyph.w + GAP;
  }
  if (!placed.length) return null;

  const W = x - GAP;
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "hello-svg");
  svg.setAttribute("viewBox", `-40 -760 ${W + 80} 1000`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  const flip = document.createElementNS(SVG_NS, "g");
  flip.setAttribute("transform", "scale(1,-1)");

  placed.forEach(({ glyph, x: lx }) => {
    const group = document.createElementNS(SVG_NS, "g");
    group.setAttribute("transform", `translate(${lx},0)`);
    glyph.s.forEach(stroke => {
      const p = document.createElementNS(SVG_NS, "path");
      p.setAttribute("d", smoothPath(stroke));
      p.setAttribute("pathLength", "1");
      p.setAttribute("stroke-width", "60");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      group.appendChild(p);
    });
    flip.appendChild(group);
  });

  svg.appendChild(flip);
  return svg;
}

function showWord(text) {
  const svg = buildWord(text);
  if (!svg) {
    stage.innerHTML = "";
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.textContent = "Use letters a–z or digits 1–9";
    stage.appendChild(msg);
    return;
  }
  stage.replaceChildren(svg);
  playGreeting();
}

function play() {
  playGreeting();
}

let typingTimer;
wordInput.addEventListener("input", () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    const v = wordInput.value.trim();
    if (v) showWord(v);
    else showGreeting(currentCode);
  }, 350);
});

typeForm.addEventListener("submit", e => {
  e.preventDefault();
  clearTimeout(typingTimer);
  const v = wordInput.value.trim();
  if (v) showWord(v);
  else showGreeting(currentCode);
});

replayBtn.addEventListener("click", play);
stage.addEventListener("click", play);

renderList("");
ddLabel.textContent = LANGS[currentCode];
showGreeting(currentCode);
</script>
</body>
</html>
